<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de imágenes</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="galeria">

        <img class="foto cueva"
            src="https://plus.unsplash.com/premium_photo-1791409401964-019aa70da0cc?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            alt="cueva con atardecer incluido">

        <img class="foto selva"
            src="https://images.unsplash.com/photo-1789758386057-93368d36b966?q=80&w=627&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDE%3D"

        <img class="foto escaleras"
            src="https://plus.unsplash.com/premium_photo-1791369740357-3c60856b2c8b?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"

            src="https://images.unsplash.com/photo-1791472612461-d8bddeb77b7c?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDE%3D"

            src="https://plus.unsplash.com/premium_photo-1792180320741-f7816af3af7f?q=80&w=738&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"

            src="https://images.unsplash.com/photo-1792208900103-cd3088eec006?q=80&w=1174&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"

</html>
